<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="See every toll plaza on your route, what it costs, and whether your RFID load covers it." />
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Sakto</title>
  </head>
  <body>
    <main id="map" aria-label="Map"></main>

    <section id="sheet" class="sheet glass" data-snap="half" aria-label="Trip planner">
      <div class="sheet-handle" id="sheet-handle"><div class="grabber" aria-hidden="true"></div></div>

      <div class="sheet-body" id="sheet-body">
        <!-- Trip -->
        <div id="view-trip" class="view">
          <div class="places">
            <label class="search-pill">
              <span class="place-dot from" aria-hidden="true"></span>
              <input id="from" type="search" enterkeyhint="search" placeholder="Starting point" aria-label="Starting point" />
              <button type="button" id="locate" class="pill-icon" aria-label="Use my location">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M20.6 3.4a.9.9 0 0 0-1-.2L3.7 9.9a.9.9 0 0 0 .1 1.7l6.6 2 2 6.6a.9.9 0 0 0 1.7.1l6.7-15.9a.9.9 0 0 0-.2-1Z"/></svg>
              </button>
            </label>
            <label class="search-pill">
              <span class="place-dot to" aria-hidden="true"></span>
              <input id="to" type="search" enterkeyhint="search" placeholder="Where to?" aria-label="Destination" />
              <button type="button" id="swap" class="pill-icon" aria-label="Swap start and destination">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M7.3 3.3a1 1 0 0 1 1.4 0l3.5 3.5a1 1 0 1 1-1.4 1.4L9 6.4V16a1 1 0 1 1-2 0V6.4L5.2 8.2a1 1 0 0 1-1.4-1.4l3.5-3.5Zm8.7 4.7a1 1 0 0 1 1 1v8.6l1.8-1.8a1 1 0 1 1 1.4 1.4l-3.5 3.5a1 1 0 0 1-1.4 0l-3.5-3.5a1 1 0 1 1 1.4-1.4l1.8 1.8V9a1 1 0 0 1 1-1Z"/></svg>
              </button>
            </label>
            <ul class="suggestions platter" id="suggestions" role="listbox" hidden></ul>
          </div>

          <div class="vehicle-row">
            <select id="vehicle" class="pill-select" aria-label="Vehicle" hidden></select>
            <div class="segmented" id="vclass" role="radiogroup" aria-label="Vehicle class">
              <button type="button" role="radio" data-class="1" aria-checked="true">Class 1</button>
              <button type="button" role="radio" data-class="2" aria-checked="false">Class 2</button>
              <button type="button" role="radio" data-class="3" aria-checked="false">Class 3</button>
            </div>
          </div>

          <p id="status" class="status" role="status" aria-live="polite"></p>
          <div id="routes" class="routes"></div>
          <div id="result"></div>
        </div>

        <!-- RFID -->
        <div id="view-rfid" class="view" hidden>
          <div id="garage"></div>

          <section class="qb" aria-labelledby="qb-title">
            <h2 id="qb-title" class="qb-title">Quick balance</h2>
            <form id="qb-form" class="qb-form">
              <label class="search-pill">
                <input id="qb-account" type="text" inputmode="numeric" autocomplete="off" placeholder="Card / account number" aria-label="Card or account number" required />
              </label>
              <button type="submit" id="qb-submit" class="qb-submit">Check</button>
            </form>
            <p id="qb-status" class="status" role="status" aria-live="polite"></p>
            <pre id="qb-result" class="qb-result" hidden></pre>
          </section>
        </div>

        <p class="fineprint">
          Fares from <a href="https://www.expressway.ph/developers" target="_blank" rel="noopener">Expressway.PH</a> (TRB matrices).
          Routes by <a href="https://project-osrm.org" target="_blank" rel="noopener">OSRM</a>.
          Map © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>.
          Check the fee shown at the plaza.
        </p>
      </div>
    </section>

    <nav class="tabbar glass" role="tablist" aria-label="Sections">
      <button type="button" role="tab" data-view="trip" aria-selected="true">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M15 4.1 9 2 3.4 4A1 1 0 0 0 3 5v14.5a.6.6 0 0 0 .8.5L9 18l6 2.1 5.6-2a1 1 0 0 0 .4-.9V3.5a.6.6 0 0 0-.8-.5L15 4.1ZM10 4.6l4 1.4v13.4l-4-1.4V4.6Z"/></svg>
        <span>Trip</span>
      </button>
      <button type="button" role="tab" data-view="rfid" aria-selected="false">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M4 5h16a2 2 0 0 1 2 2v1H2V7a2 2 0 0 1 2-2Zm-2 6h20v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6Zm3 3v2h5v-2H5Z"/></svg>
        <span>RFID</span>
      </button>
    </nav>

    <dialog id="vehicle-dialog" class="modal glass" aria-labelledby="vehicle-dialog-title"></dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Plan a drive in Luzon and see every toll plaza you enter and exit, with the toll fee per expressway." />
    <title>Toll Route PH</title>
  </head>
  <body>
    <div id="app">
      <aside id="panel" aria-label="Trip planner">
        <header class="brand">
          <h1>Toll Route PH</h1>
          <p>Every toll entry, exit and fee on your route</p>
        </header>

        <form id="trip" autocomplete="off" onsubmit="return false">
          <div class="field">
            <label for="from">From</label>
            <div class="input-row">
              <span class="dot dot-from" aria-hidden="true"></span>
              <input id="from" type="search" placeholder="Search a place or tap the map" />
              <button type="button" id="locate" class="icon-btn" title="Use my location" aria-label="Use my location">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm9 3h-2.07A7 7 0 0 0 13 5.07V3h-2v2.07A7 7 0 0 0 5.07 11H3v2h2.07A7 7 0 0 0 11 18.93V21h2v-2.07A7 7 0 0 0 18.93 13H21v-2Zm-9 6a5 5 0 1 1 0-10 5 5 0 0 1 0 10Z"/></svg>
              </button>
            </div>
            <ul class="suggestions" id="from-suggestions" role="listbox" hidden></ul>
          </div>
          <div class="field">
            <label for="to">To</label>
            <div class="input-row">
              <span class="dot dot-to" aria-hidden="true"></span>
              <input id="to" type="search" placeholder="Search a place or tap the map" />
              <button type="button" id="swap" class="icon-btn" title="Swap from and to" aria-label="Swap from and to">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M7 3 3 7l4 4V8h7V6H7V3Zm10 10v3h-7v2h7v3l4-4-4-4Z"/></svg>
              </button>
            </div>
            <ul class="suggestions" id="to-suggestions" role="listbox" hidden></ul>
          </div>
          <fieldset class="classes">
            <legend>Vehicle class</legend>
            <label><input type="radio" name="vclass" value="1" checked /><span><b>Class 1</b> Car, SUV, van</span></label>
            <label><input type="radio" name="vclass" value="2" /><span><b>Class 2</b> Bus, light truck</span></label>
            <label><input type="radio" name="vclass" value="3" /><span><b>Class 3</b> Large truck</span></label>
          </fieldset>
        </form>

        <div id="status" role="status" aria-live="polite"></div>
        <div id="routes"></div>
        <div id="result"></div>

        <footer class="fineprint">
          Fares from the <a href="https://www.expressway.ph/developers" target="_blank" rel="noopener">Expressway.PH API</a>
          (unofficial, compiled from TRB matrices). Routing © <a href="https://project-osrm.org" target="_blank" rel="noopener">OSRM</a>,
          map data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors.
          Check the fee shown at the plaza.
        </footer>
      </aside>
      <main id="map" aria-label="Map"></main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
